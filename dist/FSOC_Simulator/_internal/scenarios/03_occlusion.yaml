# Frequent loss of line of sight: dense drifting clouds plus random
# beacon dropouts. Tests coasting and re-acquisition.
disturbances:
  clouds:
    count: 10
    size_deg: [2.0, 4.0]
    optical_depth: [3.0, 6.0]
    wind_dps: [1.2, 0.3]
  dropouts:
    enabled: true
    mean_interval_s: 10.0
    duration_s: [0.5, 3.0]

# Fixed test case: no random scene, fixed seed (reproducible results).
randomize:
  enabled: false
simulation:
  seed: 42
